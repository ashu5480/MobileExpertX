<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="MobilExpertX — Your Phone. Your Upgrade. Your Expert.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3C4759"/>
      <stop offset="100%" stop-color="#0B0F18"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#08090D"/>
  <circle cx="980" cy="150" r="360" fill="url(#glow1)"/>
  <circle cx="180" cy="540" r="320" fill="url(#glow2)"/>

  <!-- Grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-weight="800">
    <text x="80" y="250" font-size="62" fill="#FFFFFF" letter-spacing="-1.5">MOBIL</text>
    <text x="272" y="250" font-size="62" fill="url(#brand)" letter-spacing="-1.5">EXPERTX</text>
  </g>

  <text x="80" y="330" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif"
        font-size="40" font-weight="700" fill="#FFFFFF" letter-spacing="-1">
    Your Phone. Your Upgrade. Your Expert.
  </text>

  <text x="80" y="385" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.62">
    Buy premium smartphones, sell your old device, get expert repairs,
  </text>
  <text x="80" y="420" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.62">
    and shop genuine accessories — all in one place.
  </text>

  <!-- Feature pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600">
    <rect x="80" y="470" width="188" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="102" y="499" fill="#FFFFFF" fill-opacity="0.82">Verified Devices</text>

    <rect x="282" y="470" width="166" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="304" y="499" fill="#FFFFFF" fill-opacity="0.82">Expert Repairs</text>

    <rect x="462" y="470" width="176" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="484" y="499" fill="#FFFFFF" fill-opacity="0.82">Secure Payments</text>
  </g>

  <!-- Phone mock -->
  <g transform="translate(920 210)">
    <ellipse cx="0" cy="215" rx="105" ry="18" fill="#000" opacity="0.45"/>
    <rect x="-92" y="-120" width="184" height="360" rx="34" fill="url(#phone)"/>
    <rect x="-92" y="-120" width="184" height="360" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
    <rect x="-79" y="-107" width="158" height="334" rx="26" fill="#0B1020"/>
    <rect x="-79" y="-107" width="158" height="334" rx="26" fill="url(#brand)" opacity="0.28"/>
    <circle cx="0" cy="150" r="5" fill="#00D9FF"/>
    <rect x="-62" y="-86" width="124" height="6" rx="3" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="-66" cy="76" r="15" fill="#000" opacity="0.5"/>
  </g>
</svg>
